<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Log in or create an account to use SalesCast.">
<title>Log in - SalesCast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one centered card on a quiet background; brand on top, tabs, form, short note. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #14181f; --muted: #5b6472; --line: #dde1e7;
  --accent: #1d5fd6; --accent-fg: #ffffff; --bad: #b42318; --good: #12805c; --soft: #eef0f4;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --surface: #171b22; --fg: #e8ebf0; --muted: #9aa3b0; --line: #2a303a;
    --accent: #6ea3ff; --accent-fg: #0f1217; --bad: #f87171; --good: #4ade80; --soft: #1e232c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #171b22; --fg: #e8ebf0; --muted: #9aa3b0; --line: #2a303a;
  --accent: #6ea3ff; --accent-fg: #0f1217; --bad: #f87171; --good: #4ade80; --soft: #1e232c; color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
@media (prefers-color-scheme: dark) { html { color-scheme: dark; } }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; }
.brand { font-family: var(--font-head); font-weight: 700; font-size: 1.5rem; }
.sub { color: var(--muted); margin: 4px 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--soft); border-radius: 8px; padding: 4px; }
.seg button { border: 0; background: transparent; padding: 8px; border-radius: 6px; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 13px; font-weight: 500; }
input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; width: 100%; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pw { position: relative; }
.pw input { padding-right: 64px; }
.pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; padding: 6px; }
.hint { font-size: 12.5px; color: var(--muted); }
.submit { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 7px; padding: 11px; font: inherit; font-weight: 600; cursor: pointer; }
.submit:disabled { opacity: 0.6; cursor: default; }
#msg { min-height: 20px; font-size: 14px; color: var(--bad); }
#msg.ok { color: var(--good); }
.note { font-size: 12.5px; color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<script>
/* already logged in: go straight to the site */
(function () {
  try { if (JSON.parse(localStorage.getItem("salescast_session") || "null")) location.replace("index.html"); } catch (e) {}
})();
</script>

<main class="wrap">
  <header>
    <div class="brand">SalesCast</div>
    <p class="sub" id="sub">Log in to see your sales forecast.</p>
  </header>

  <div class="card">
    <div class="seg" role="group" aria-label="Log in or sign up">
      <button type="button" id="tab-login" aria-pressed="true">Log in</button>
      <button type="button" id="tab-signup" aria-pressed="false">Sign up</button>
    </div>

    <form id="form" novalidate>
      <div class="field" id="f-name" hidden>
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" inputmode="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password">
          <button type="button" id="toggle" aria-label="Show password">Show</button>
        </div>
        <span class="hint" id="pwhint" hidden>At least 8 characters.</span>
      </div>
      <div class="field" id="f-confirm" hidden>
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" placeholder="Type it again">
      </div>
      <div id="msg" role="alert" aria-live="polite"></div>
      <button class="submit" id="submit" type="submit">Log in</button>
    </form>
  </div>

  <p class="note">Accounts are saved in this browser only. This is a simple demo login, so please do not reuse a password from another site.</p>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var mode = "login";

  function setMode(m) {
    mode = m;
    var signup = m === "signup";
    $("tab-login").setAttribute("aria-pressed", String(!signup));
    $("tab-signup").setAttribute("aria-pressed", String(signup));
    $("f-name").hidden = !signup;
    $("f-confirm").hidden = !signup;
    $("pwhint").hidden = !signup;
    $("submit").textContent = signup ? "Create account" : "Log in";
    $("sub").textContent = signup ? "Create an account to use SalesCast." : "Log in to see your sales forecast.";
    $("password").autocomplete = signup ? "new-password" : "current-password";
    msg("");
  }
  function msg(t, ok) { var el = $("msg"); el.textContent = t; el.className = ok ? "ok" : ""; }

  /* storage helpers (wrapped: storage can be blocked in private windows) */
  function getUsers() { try { return JSON.parse(localStorage.getItem("salescast_users") || "{}"); } catch (e) { return {}; } }
  function saveUsers(u) { localStorage.setItem("salescast_users", JSON.stringify(u)); }

  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join(""); }
  function hash(pw, salt) {
    if (!(window.crypto && crypto.subtle)) return Promise.resolve("plain:" + pw);
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pw)).then(hex);
  }
  function makeSalt() {
    var a = new Uint8Array(16); crypto.getRandomValues(a); return hex(a);
  }
  function validEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  function start(user) {
    localStorage.setItem("salescast_session", JSON.stringify({ email: user.email, name: user.name }));
    msg(mode === "signup" ? "Account created. Opening SalesCast..." : "Logged in. Opening SalesCast...", true);
    location.replace("index.html");
  }

  $("tab-login").addEventListener("click", function () { setMode("login"); });
  $("tab-signup").addEventListener("click", function () { setMode("signup"); });
  $("toggle").addEventListener("click", function () {
    var show = $("password").type === "password";
    $("password").type = show ? "text" : "password";
    this.textContent = show ? "Hide" : "Show";
    this.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var email = $("email").value.trim().toLowerCase(), pw = $("password").value, name = $("name").value.trim();
    if (!validEmail(email)) { msg("Enter a valid email address."); $("email").focus(); return; }
    if (!pw) { msg("Enter your password."); $("password").focus(); return; }
    var users;
    try { users = getUsers(); } catch (e) { msg("This browser is blocking storage. Turn off private mode and try again."); return; }
    $("submit").disabled = true;

    if (mode === "signup") {
      if (!name) { msg("Enter your name."); $("submit").disabled = false; $("name").focus(); return; }
      if (pw.length < 8) { msg("Password must be at least 8 characters."); $("submit").disabled = false; $("password").focus(); return; }
      if (pw !== $("confirm").value) { msg("The two passwords do not match."); $("submit").disabled = false; $("confirm").focus(); return; }
      if (users[email]) { msg("An account with this email already exists. Log in instead."); $("submit").disabled = false; return; }
      var salt = window.crypto && crypto.getRandomValues ? makeSalt() : "s";
      hash(pw, salt).then(function (h) {
        users[email] = { name: name, salt: salt, hash: h };
        try { saveUsers(users); } catch (e) { msg("Could not save the account. Check that storage is allowed."); $("submit").disabled = false; return; }
        start({ email: email, name: name });
      });
    } else {
      var u = users[email];
      if (!u) { msg("No account found for this email. Sign up first."); $("submit").disabled = false; return; }
      hash(pw, u.salt).then(function (h) {
        if (h !== u.hash) { msg("Wrong password. Try again."); $("submit").disabled = false; $("password").select(); return; }
        start({ email: email, name: u.name });
      });
    }
  });
})();
</script>
</body>
</html>
